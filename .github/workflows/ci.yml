name: CI

# Corre en cada push a main y en cada PR. El objetivo es que NINGÚN cambio se mergee sin
# pasar typecheck + lint + los tests unitarios — antes no corría nada automático (auditoría
# pre-producción, TEST-001). El BUILD lo hace Vercel en cada deploy, así que no se duplica acá
# (evita tener que meter env vars de Firebase en el CI). Los tests son funciones PURAS
# (money/geo/delivery-pricing), no tocan Firestore ni necesitan secretos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests unitarios
        run: npm run test

  # Tests de REGLAS de Firestore contra el emulador (ARQ-026, auditoría oct 2026): cargan el
  # firestore.rules del repo y prueban ataque + regresión ANTES de desplegar. El emulador exige
  # Java 21 (firebase-tools 15.x). Es un job aparte para que un fallo del emulador no tape el
  # resultado del typecheck/lint/unitarios.
  reglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm ci
      - name: Tests de reglas (emulador)
        run: npm run test:rules
